name: Generar instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: MDS-Ventas-Windows
          path: dist/*.exe
          if-no-files-found: error
